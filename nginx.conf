# ============================================================
# Smart Barangay — Production NGINX Load Balancer Configuration
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Logging Format with Upstream Node Tracking
    log_format loadbalanced '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for" '
                            'upstream: $upstream_addr ($upstream_status in ${upstream_response_time}s)';

    access_log /var/log/nginx/access.log loadbalanced;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting Zones (DDoS Mitigation)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    # ------------------------------------------------------------
    # ⚖️ UPSTREAM LOAD BALANCED POOL
    # ------------------------------------------------------------
    upstream smart_barangay_cluster {
        # Balancing Algorithm Options:
        # 1. Round-Robin (default, no directive)
        # 2. least_conn;
        # 3. ip_hash;
        least_conn;

        # Node replicas with health parameters
        server backend_1:8000 max_fails=3 fail_timeout=10s;
        server backend_2:8000 max_fails=3 fail_timeout=10s;
        server backend_3:8000 max_fails=3 fail_timeout=10s;

        # Keepalive persistent connections to backend workers
        keepalive 32;
    }

    # ------------------------------------------------------------
    # 🌐 HTTP SERVER (PORT 80 -> HTTPS REDIRECT / PROXY)
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # Health probe endpoint for cloud load balancers (AWS ALB / Cloudflare)
        location /lb-health {
            access_log off;
            return 200 '{"status":"HEALTHY","service":"nginx-load-balancer"}';
            add_header Content-Type application/json;
        }

        # Main API Reverse Proxy & Load Balancer
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr_limit 50;

            proxy_pass http://smart_barangay_cluster;
            proxy_http_version 1.1;

            # Header Propagation
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;

            # Next upstream failover conditions
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
