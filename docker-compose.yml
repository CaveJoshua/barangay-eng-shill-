# ============================================================
# Smart Barangay — Multi-Instance Load Balanced Stack
# ============================================================

version: '3.8'

services:
  # ------------------------------------------------------------
  # ⚖️ NGINX LOAD BALANCER REVERSE PROXY
  # ------------------------------------------------------------
  load_balancer:
    image: nginx:alpine
    container_name: smart_barangay_load_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend_1
      - backend_2
      - backend_3
    restart: unless-stopped
    networks:
      - app_network

  # ------------------------------------------------------------
  # 🚀 BACKEND API REPLICA 1
  # ------------------------------------------------------------
  backend_1:
    build: .
    container_name: smart_barangay_backend_1
    environment:
      - PORT=8000
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  # ------------------------------------------------------------
  # 🚀 BACKEND API REPLICA 2
  # ------------------------------------------------------------
  backend_2:
    build: .
    container_name: smart_barangay_backend_2
    environment:
      - PORT=8000
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

  # ------------------------------------------------------------
  # 🚀 BACKEND API REPLICA 3
  # ------------------------------------------------------------
  backend_3:
    build: .
    container_name: smart_barangay_backend_3
    environment:
      - PORT=8000
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
