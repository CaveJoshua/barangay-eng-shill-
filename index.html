  <body>
    <div id="root">
      <!-- Instant Pre-Mount Splash Screen (Architectural Seal Loader) -->
      <style>
        .eng-preloader-wrap {
          --bg-color: #f4f4f0;
          --stroke-color: #121212;
          --grid-color: rgba(0, 0, 0, 0.04);
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: var(--bg-color);
          background-image: 
            linear-gradient(var(--grid-color) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
          background-size: 20px 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 999999;
          margin: 0;
          padding: 0;
          font-family: Arial, sans-serif;
        }
        .eng-preloader-stage {
          width: 520px;
          height: 520px;
          max-width: 90vw;
          max-height: 90vw;
          position: relative;
        }
        .eng-preloader-stage svg {
          width: 100%;
          height: 100%;
        }
        .draw-stroke {
          fill: none;
          stroke: #121212;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 2000;
          stroke-dashoffset: 2000;
          animation: drawLine 3.5s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        .w-thick  { stroke-width: 3.8px; }
        .w-medium { stroke-width: 2.0px; }
        .w-fine   { stroke-width: 1.2px; }
        .cropped-center-img {
          filter: saturate(112%) contrast(106%) brightness(102%);
          opacity: 0;
          animation: fadeInCenter 0.8s ease forwards;
          animation-delay: 0.2s;
        }
        .outlined-text {
          fill: #121212;
          stroke: #121212;
          stroke-width: 0.6px;
          font-size: 26px;
          font-weight: 900;
          letter-spacing: 2px;
          opacity: 1;
        }
        .outlined-text.text-bottom {
          font-size: 27px;
          letter-spacing: 5.5px;
        }
        @keyframes drawLine {
          0% { stroke-dashoffset: 2000; }
          100% { stroke-dashoffset: 0; }
        }
        @keyframes fadeInCenter {
          0% { opacity: 0; }
          100% { opacity: 1; }
        }
      </style>
      <div class="eng-preloader-wrap">
        <div class="eng-preloader-stage">
          <svg viewBox="0 0 500 500">
            <defs>
              <path id="pre-text-arc-top" d="M 62,250 A 188,188 0 1,1 438,250" />
              <path id="pre-text-arc-bottom" d="M 66,250 A 184,184 0 0,0 434,250" />
              <clipPath id="pre-center-crop-mask">
                <circle cx="250" cy="250" r="141" />
              </clipPath>
            </defs>

            <circle class="draw-stroke w-thick" cx="250" cy="250" r="238" />
            <circle class="draw-stroke w-fine"  cx="250" cy="250" r="226" />
            <circle class="draw-stroke w-fine"  cx="250" cy="250" r="152" />
            <circle class="draw-stroke w-thick" cx="250" cy="250" r="142" />

            <circle class="draw-stroke w-medium" cx="61"  cy="250" r="7" />
            <circle class="draw-stroke w-medium" cx="439" cy="250" r="7" />

            <image 
              class="cropped-center-img"
              href="/src/assets/icons/Barangay_eng-hill.png" 
              x="32" 
              y="32" 
              width="436" 
              height="436" 
              clip-path="url(#pre-center-crop-mask)"
              preserveAspectRatio="xMidYMid slice"
            />

            <text class="outlined-text">
              <textPath href="#pre-text-arc-top" startOffset="50%" text-anchor="middle">
                ENGINEERS HILL BARANGAY
              </textPath>
            </text>

            <text class="outlined-text text-bottom">
              <textPath href="#pre-text-arc-bottom" startOffset="50%" text-anchor="middle">
                BAGUIO CITY
              </textPath>
            </text>
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
